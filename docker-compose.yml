services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: market-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Market@2024!"
    ports:
      - "1434:1433"
    volumes:
      - market-sql-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Market@2024!' -C -Q 'SELECT 1' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build:
      context: ./MarketApp.API
      dockerfile: Dockerfile
    container_name: market-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=MarketDb;User Id=sa;Password=Market@2024!;TrustServerCertificate=True;"
    ports:
      - "5228:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: on-failure

  ui:
    build:
      context: ./market-ui
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: market-ui
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  market-sql-data:
